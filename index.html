<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rondonia IoT</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section id="login-view" class="panel login-panel">
        <p class="eyebrow">MONITORAMENTO AMBIENTAL</p>
        <h1>Rondonia IoT</h1>
        <p class="muted">Acesso ao mapa de sensores e ultima comunicacao.</p>
        <form id="login-form">
          <label>Usuario<input name="username" value="admin" autocomplete="username" required /></label>
          <label>Senha<input name="password" type="password" autocomplete="current-password" required /></label>
          <button type="submit">Entrar</button>
          <p id="login-error" class="error"></p>
        </form>
      </section>

      <section id="app-view" hidden>
        <header class="topbar">
          <div>
            <p class="eyebrow">PAINEL DE CAMPO</p>
            <h1>Mapa IoT</h1>
          </div>
          <div class="actions"><span id="updated-at" class="muted"></span><button id="logout" class="ghost">Sair</button></div>
        </header>
        <section class="toolbar panel">
          <label>Regiao<select id="region-filter"><option value="all">Todas</option></select></label>
          <label>Status<select id="status-filter"><option value="all">Todos</option><option value="online">Ativos</option><option value="offline">Offline</option></select></label>
          <button id="refresh" class="ghost">Atualizar</button>
        </section>
        <section id="summary" class="summary"></section>
        <section id="map"></section>
        <section id="device-list" class="device-grid"></section>
      </section>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
